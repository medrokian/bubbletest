
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bubbles Screensaver</title>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 100%;
            height: 100%;
            background: #000000;
        }

        canvas {
            display: block;
        }
    </style>
</head>
<body>

<canvas id="bubblesCanvas"></canvas>

<script>
const canvas = document.getElementById('bubblesCanvas');
const ctx = canvas.getContext('2d');

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// Image configuration
const imageNumbers = [
    ...Array.from({ length: 16 }, (_, i) => i),
    20, 30, 35
];

const images = [];

let loadedImages = 0;
const totalImages = imageNumbers.length;

imageNumbers.forEach(number => {
    const img = new Image();
    img.src = `j${number}.png`;

    img.onload = () => {
        loadedImages++;

        if (loadedImages === totalImages) {
            init();
            animate();
        }
    };

    img.onerror = () => {
        console.error(`Failed to load j${number}.png`);
    };

    images.push({
        number,
        image: img
    });
});

// Object configuration
const bubbles = [];
const bubbleCount = imageNumbers.length * 2;
const bubbleSize = 70;

const gravityDirections = [
    { x: 0, y: -1 },
    { x: 0, y: 1 },
    { x: -1, y: 0 },
    { x: 1, y: 0 },
    { x: -1, y: -1 },
    { x: 1, y: -1 },
    { x: -1, y: 1 },
    { x: 1, y: 1 }
];

let currentGravityDirection = { x: 0, y: 0 };
let targetGravityDirection = { x: 0, y: -1 };
let lastGravityDirectionIndex = -1;

class Bubble {
    constructor(image, flipped = false) {
        this.image = image;
        this.flipped = flipped;

        this.radius = bubbleSize;

        this.x = Math.random() * Math.max(1, canvas.width - bubbleSize * 2) + bubbleSize;
        this.y = Math.random() * Math.max(1, canvas.height - bubbleSize * 2) + bubbleSize;

        this.speedX = (Math.random() - 0.5) * 8;
        this.speedY = (Math.random() - 0.5) * 8;

        this.opacity = Math.random() * 0.5 + 0.5;
        this.hue = Math.random() * 360;
    }

    update() {
        this.x += this.speedX + currentGravityDirection.x * 0.5;
        this.y += this.speedY + currentGravityDirection.y * 0.5;

        // Wall collisions
        const phaseRadius = this.radius;

        if (this.x - this.radius < -phaseRadius) {
            this.x = -phaseRadius + this.radius;
            this.speedX = -this.speedX;
        }

        if (this.x + this.radius > canvas.width + phaseRadius) {
            this.x = canvas.width + phaseRadius - this.radius;
            this.speedX = -this.speedX;
        }

        if (this.y - this.radius < -phaseRadius) {
            this.y = -phaseRadius + this.radius;
            this.speedY = -this.speedY;
        }

        if (this.y + this.radius > canvas.height + phaseRadius) {
            this.y = canvas.height + phaseRadius - this.radius;
            this.speedY = -this.speedY;
        }

        // Object collisions
        for (let other of bubbles) {
            if (this !== other && this.isCollidingWith(other)) {
                this.resolveCollision(other);
            }
        }
    }

    isCollidingWith(other) {
        const dx = this.x - other.x;
        const dy = this.y - other.y;

        return Math.hypot(dx, dy) < this.radius + other.radius;
    }

    resolveCollision(other) {
        const dx = this.x - other.x;
        const dy = this.y - other.y;

        const distance = Math.hypot(dx, dy);

        if (distance === 0) return;

        const nx = dx / distance;
        const ny = dy / distance;

        const tx = -ny;
        const ty = nx;

        const dpTan1 = this.speedX * tx + this.speedY * ty;
        const dpTan2 = other.speedX * tx + other.speedY * ty;

        const dpNorm1 = this.speedX * nx + this.speedY * ny;
        const dpNorm2 = other.speedX * nx + other.speedY * ny;

        const m1 = (
            dpNorm1 * (this.radius - other.radius) +
            2 * other.radius * dpNorm2
        ) / (this.radius + other.radius);

        const m2 = (
            dpNorm2 * (other.radius - this.radius) +
            2 * this.radius * dpNorm1
        ) / (this.radius + other.radius);

        this.speedX = tx * dpTan1 + nx * m1;
        this.speedY = ty * dpTan1 + ny * m1;

        other.speedX = tx * dpTan2 + nx * m2;
        other.speedY = ty * dpTan2 + ny * m2;

        // Separate overlapping objects
        const overlap = this.radius + other.radius - distance;

        const shiftX = nx * overlap / 2;
        const shiftY = ny * overlap / 2;

        this.x += shiftX;
        this.y += shiftY;

        other.x -= shiftX;
        other.y -= shiftY;
    }

    draw() {
        ctx.save();

        ctx.globalAlpha = this.opacity;

        ctx.translate(this.x, this.y);

        if (this.flipped) {
            ctx.rotate(Math.PI);
        }

        ctx.drawImage(
            this.image,
            -this.radius,
            -this.radius,
            this.radius * 2,
            this.radius * 2
        );

        ctx.restore();
    }
}

// Initialize all objects
function init() {
    bubbles.length = 0;

    images.forEach(entry => {
        // First instance: normal
        bubbles.push(new Bubble(entry.image, false));

        // Second instance: rotated 180 degrees
        bubbles.push(new Bubble(entry.image, true));
    });
}

// Animation loop
function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    bubbles.forEach(bubble => {
        bubble.update();
        bubble.draw();
    });

    updateGravityDirection();

    requestAnimationFrame(animate);
}

// Gravity direction changes
function changeGravityDirection() {
    let newIndex;

    do {
        newIndex = Math.floor(Math.random() * gravityDirections.length);
    } while (newIndex === lastGravityDirectionIndex);

    targetGravityDirection = gravityDirections[newIndex];
    lastGravityDirectionIndex = newIndex;
}

// Smooth gravity transitions
function updateGravityDirection() {
    const step = 0.01;

    const dx = targetGravityDirection.x - currentGravityDirection.x;
    const dy = targetGravityDirection.y - currentGravityDirection.y;

    if (Math.abs(dx) > step) {
        currentGravityDirection.x += step * Math.sign(dx);
    } else {
        currentGravityDirection.x = targetGravityDirection.x;
    }

    if (Math.abs(dy) > step) {
        currentGravityDirection.y += step * Math.sign(dy);
    } else {
        currentGravityDirection.y = targetGravityDirection.y;
    }
}

// Resize handling
window.addEventListener('resize', () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    bubbles.forEach(bubble => {
        bubble.x = Math.min(
            Math.max(bubble.x, 0),
            canvas.width
        );

        bubble.y = Math.min(
            Math.max(bubble.y, 0),
            canvas.height
        );
    });
});

// Start gravity changes
setInterval(changeGravityDirection, 5000);

</script>
</body>
</html>
